$kind: http-example
request:
  url: "{{baseUrl}}/:orderId/shipment"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Ocp-Apim-Subscription-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    orderId: string
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "orderId": "string",
        "carrier": "UPS",
        "trackingNumber": "1Z999AA10123456784",
        "status": "label_created"
      }
order: 1000

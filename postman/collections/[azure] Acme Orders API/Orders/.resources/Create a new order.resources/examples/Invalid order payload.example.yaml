$kind: http-example
request:
  url: "{{baseUrl}}/"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Ocp-Apim-Subscription-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "customerId": "cust_01HZX92A",
        "currency": "USD",
        "items": [
          {
            "sku": "SKU-WIDGET-01",
            "quantity": 2,
            "unitPriceCents": 2499
          }
        ]
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "string",
        "message": "string"
      }
order: 2000
